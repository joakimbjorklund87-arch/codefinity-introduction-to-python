<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Front Fill Calculator</title>
    <link rel="stylesheet" href="static/styles.css">
  </head>
  <body>
    <main>
      <h1>Front Fill Calculator</h1>

      <form id="calc-form" onsubmit="event.preventDefault(); calculate();">
        <label>Stage width (m)
          <input id="stage_width" type="number" step="0.01" value="12" required>
        </label>

        <label>Speaker coverage (°)
          <input id="speaker_coverage" type="number" step="0.1" value="60" required>
        </label>

        <label>Audience distance (m)
          <input id="audience_distance" type="number" step="0.01" value="8" required>
        </label>

        <button type="submit">Calculate</button>
      </form>

      <section id="results" aria-live="polite">
        <p id="min-speakers"></p>
        <p id="center-spacing"></p>
        <p id="edge-spacing"></p>
        <p id="notes"></p>
      </section>
    </main>

    <script src="static/script.js"></script>
  </body>
</html>
